name: verify

on:
  pull_request:
  push:
    branches: [main, qq]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:imports
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run load:test
      - run: npm audit --audit-level=high
      - run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t questshop:${{ github.sha }} .
          test "$(docker run --rm --entrypoint cat questshop:${{ github.sha }} .source-sha)" = "${{ github.sha }}"
